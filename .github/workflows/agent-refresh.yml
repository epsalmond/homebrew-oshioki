name: agent-refresh

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v

  homebrew-postinstall:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The declarative post-install DSL is required. Do not rely on the
      # runner image's older Homebrew or disable its normal sandbox.
      - run: brew update
      - run: brew install python@3.14
      - run: python3 -m unittest discover -s tests -v
      - name: Production-label package replacement, bottle pour and reinstall
        run: python3 tests/integration.py

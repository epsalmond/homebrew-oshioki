name: bottle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Oshioki release tag to bottle (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  bottle:
    runs-on: macos-14
    env:
      TAG: ${{ inputs.tag }}
      ROOT_URL: https://github.com/epsalmond/oshioki/releases/download/${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the formula at the release tarball
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          TARBALL="oshioki-macos-arm64-$VER.tar.gz"
          curl -sSL -o "/tmp/$TARBALL" "$ROOT_URL/$TARBALL"
          SHA="$(shasum -a 256 "/tmp/$TARBALL" | awk '{print $1}')"
          python3 - "$TAG" "$VER" "$SHA" <<'EOF'
          import re, sys
          tag, ver, sha = sys.argv[1:4]
          path = "Formula/oshioki.rb"
          src = open(path).read()
          src = re.sub(r'^  url ".*"$',
                        f'  url "https://github.com/epsalmond/oshioki/releases/download/{tag}/oshioki-macos-arm64-{ver}.tar.gz"',
                        src, flags=re.M)
          src = re.sub(r'^  sha256 ".*"$', f'  sha256 "{sha}"', src, flags=re.M)
          src = re.sub(r'^  version ".*"$', f'  version "{ver}"', src, flags=re.M)
          open(path, "w").write(src)
          EOF
      - name: Bottle the formula
        run: |
          brew install --build-bottle epsalmond/oshioki/oshioki
          brew bottle --json --root-url="$ROOT_URL" epsalmond/oshioki/oshioki
      - name: Upload the bottle to the release
        run: gh release upload "$TAG" oshioki--*.bottle.tar.gz --repo epsalmond/oshioki --clobber
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: Merge the bottle block and push
        run: |
          python3 - <<'EOF'
          import glob, json, re
          [path] = glob.glob("oshioki--*.bottle.json")
          data = json.load(open(path))
          bottle = next(iter(data.values()))["bottle"]
          lines = ["  bottle do"]
          lines.append(f'    root_url "{bottle["root_url"]}"')
          for tag, info in bottle["files"].items():
              lines.append(f'    sha256 cellar: :any, {tag}: "{info["sha256"]}"')
          lines.append("  end")
          block = "\n".join(lines)
          formula = "Formula/oshioki.rb"
          src = open(formula).read()
          if re.search(r"  bottle do.*?  end\n", src, flags=re.S):
              src = re.sub(r"  bottle do.*?  end\n", block + "\n", src, flags=re.S)
          else:
              # First bottling: no block yet, insert it after the sha256 line.
              src = re.sub(r'(^  sha256 ".*"$)',
                           r"\1\n\n" + block, src, flags=re.M)
          open(formula, "w").write(src)
          EOF
          git config user.name "oshioki-bottle-bot"
          git config user.email "oshioki-bottle-bot@users.noreply.github.com"
          git add Formula/oshioki.rb
          git commit -m "Bottle ${{ inputs.tag }}" && git push

name: bottle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Signed Oshioki release tag to bottle (v0.4.1 or later)"
        required: true
        type: string
      upload:
        description: "Upload absent bottle assets after checks (does not update the tap)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bottle-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update Homebrew and install public provenance verifier
        run: |
          brew update
          brew install gnupg
      - name: Verify release and generate candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release_candidate.py fetch "$TAG" "$RUNNER_TEMP/upstream"
          python3 scripts/release_candidate.py prepare Formula/oshioki.rb \
            "$RUNNER_TEMP/upstream" .github/signing "$TAG" "$RUNNER_TEMP/candidate"
      - name: Install the exact local canonical candidate
        run: |
          set -euo pipefail
          brew tap-new --no-git epsalmond/oshioki
          formula="$(brew --repository epsalmond/oshioki)/Formula/oshioki.rb"
          cp "$RUNNER_TEMP/candidate/Formula/oshioki.rb" "$formula"
          python3 scripts/release_candidate.py assert-candidate "$formula" "$RUNNER_TEMP/candidate"
          brew install --only-dependencies --build-from-source epsalmond/oshioki/oshioki
          brew install --build-bottle epsalmond/oshioki/oshioki
          brew test epsalmond/oshioki/oshioki
          python3 scripts/release_candidate.py assert-candidate "$formula" "$RUNNER_TEMP/candidate"
      - name: Bottle, pour, and test candidate
        run: |
          set -euo pipefail
          root_url="https://github.com/epsalmond/oshioki/releases/download/$TAG"
          brew bottle --no-rebuild --skip-relocation --json --root-url="$root_url" epsalmond/oshioki/oshioki
          bottles=(oshioki--*.bottle*.tar.gz)
          jsons=(oshioki--*.bottle*.json)
          test "${#bottles[@]}" -eq 1
          test "${#jsons[@]}" -eq 1
          brew uninstall --force epsalmond/oshioki/oshioki
          brew trust --formula epsalmond/oshioki/oshioki
          HOMEBREW_DEVELOPER=1 brew install "./${bottles[0]}"
          brew test epsalmond/oshioki/oshioki
          python3 scripts/release_candidate.py finish \
            "$(brew --repository epsalmond/oshioki)/Formula/oshioki.rb" \
            "$RUNNER_TEMP/candidate" "${jsons[0]}" "${bottles[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-formula-candidate
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
      - name: Describe signed PR handoff
        run: |
          echo 'Download signed-formula-candidate, verify SHA256SUMS, review provenance.json and formula.patch, then submit Formula/oshioki.rb in a human-signed PR. Uploading bottles does not change tap source.' >>"$GITHUB_STEP_SUMMARY"

  upload:
    needs: candidate
    if: inputs.upload && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # RELEASE_TOKEN can also write upstream source: GitHub contents:write
    # is not asset-only. Reviewed no-bypass ref controls are a prerequisite.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require reviewed upload authority and active ref controls
        env:
          REVIEWED: ${{ vars.BOTTLE_UPLOAD_AUTHORITY_REVIEWED }}
        run: |
          test "$REVIEWED" = true || {
            echo 'Bottle upload blocked: review RELEASE_TOKEN scope and active upstream signing/main/tag rules with no token bypass, then record BOTTLE_UPLOAD_AUTHORITY_REVIEWED=true.' >&2
            exit 1
          }
      - uses: actions/download-artifact@v4
        with:
          name: signed-formula-candidate
          path: candidate
      - name: Upload without replacing published bytes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: python3 scripts/upload_bottle.py candidate
